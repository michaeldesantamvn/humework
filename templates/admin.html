<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Управление участками</title><style>body{font-family:Arial;margin:0;background:#f4f6f5;color:#17221c}.top{position:sticky;top:0;background:#fff;padding:14px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;z-index:3}.wrap{padding:18px;max-width:1500px;margin:auto}.filters{display:flex;gap:8px;margin-bottom:14px}.filters input,.filters select,.filters button{padding:10px;border:1px solid #ccc;border-radius:8px}.grid{display:grid;gap:10px}.row{display:grid;grid-template-columns:70px 90px 140px 140px 170px 1fr 150px;gap:8px;align-items:center;background:#fff;padding:10px;border-radius:12px}.row input,.row select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.row button{padding:10px;border:0;border-radius:8px;background:#17663d;color:#fff}.settings{margin-bottom:18px;background:#fff;padding:16px;border-radius:12px}.settings-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.settings label{display:flex;gap:7px;align-items:center}.settings input[type="text"]{padding:9px;border:1px solid #ddd;border-radius:8px;min-width:160px}.settings button{padding:10px 14px;border:0;border-radius:8px;background:#17663d;color:#fff;font-weight:700}.leads{margin-top:30px;background:#fff;padding:16px;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}@media(max-width:1000px){.row{grid-template-columns:1fr 1fr}.row>*{min-width:0}.row button{grid-column:1/-1}}</style></head><body><div class="top"><b>КП «Альбатрос» — участки</b><a href="/admin/logout">Выйти</a></div><div class="wrap"><section class="settings"><h2 style="margin-top:0">Статистика на генплане</h2><form action="/admin/settings" method="post"><div class="settings-row"><label><input type="checkbox" name="stats_enabled" value="1" {% if settings.get('stats_enabled','1')=='1' %}checked{% endif %}> Показывать блок</label><label><input type="checkbox" name="stats_show_free" value="1" {% if settings.get('stats_show_free','1')=='1' %}checked{% endif %}> Свободные</label><label><input type="checkbox" name="stats_show_busy" value="1" {% if settings.get('stats_show_busy','1')=='1' %}checked{% endif %}> Проданные</label><label>Подпись свободных <input type="text" name="stats_free_label" value="{{settings.get('stats_free_label','Свободно')}}"></label><label>Подпись проданных <input type="text" name="stats_busy_label" value="{{settings.get('stats_busy_label','Продано')}}"></label><button>Сохранить настройки</button></div></form></section><form class="filters"><input name="q" value="{{q}}" placeholder="Номер"><select name="status"><option value="">Все статусы</option>{% for k,v in labels.items() %}<option value="{{k}}" {% if status==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select><button>Найти</button></form><div class="grid">{% for p in plots %}<form class="row" action="/admin/plot/{{p.id}}" method="post" enctype="multipart/form-data"><b>№ {{p.num}}</b><input name="area" type="number" step="0.01" value="{{p.area}}" title="Площадь"><input name="price" type="number" step="1" value="{{p.price}}" title="Цена"><input name="alt_price" type="number" step="1" value="{{p.alt_price}}" title="Цена с подрядом"><select name="status">{% for k,v in labels.items() %}<option value="{{k}}" {% if p.status==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select><input name="description" value="{{p.description}}" placeholder="Комментарий"><input name="image" type="file" accept="image/*"><button>Сохранить</button></form>{% endfor %}</div><section class="leads"><h2>Последние заявки</h2><table><tr><th>Дата</th><th>Участок</th><th>Имя</th><th>Телефон</th><th>Источник</th></tr>{% for l in leads %}<tr><td>{{l.created_at}}</td><td>№ {{l.plot_num}}</td><td>{{l.name}}</td><td>{{l.phone}}</td><td>{{l.source_url}}</td></tr>{% endfor %}</table></section></div></body></html>
